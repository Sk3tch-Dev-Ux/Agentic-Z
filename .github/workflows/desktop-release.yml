name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual tag to build (e.g. desktop-v0.6.0)'
        required: true
        default: 'desktop-v0.6.0'

jobs:
  build:
    name: Build Tauri ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: agentic-z-windows-x64
          # Uncomment when adding Mac/Linux. Tauri targets work for these but
          # DayZ itself is Windows-only, so v1 is Windows-first.
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact-name: agentic-z-macos-arm64
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu
          #   artifact-name: agentic-z-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ matrix.os }}-${{ hashFiles('desktop/pnpm-lock.yaml', 'desktop/package.json') }}

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Install sidecar deps
        working-directory: desktop/sidecar
        run: pip install -r requirements.txt

      - name: Sanity check sidecar
        working-directory: desktop/sidecar
        run: python -c "import main; print('sidecar imports cleanly')"

      - name: Build Tauri
        working-directory: desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release (draft)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Agentic-Z desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Agentic-Z desktop ${{ github.ref_name }}

            DayZ modding command center. See `desktop/docs/INSTALL.md` for the
            install guide.

            **Highlights:**
            - Mod Creator — pitch a mod idea, Claude writes the scaffold
            - Director — autonomous goal-pursuer with live state-machine viz
            - Live event feed + skill buttons (Build/Launch/Stop)
            - Cmd+K RAG search across vanilla / wiki / your code
            - Skill proposal manager

            **Prerequisites for end users:**
            - Windows 10/11
            - DayZ + DayZ Tools (Steam)
            - Python 3.10+ on PATH
            - Anthropic API key (for Mod Creator)

            **What changed:** see [the diff against the previous tag](../../compare/desktop-v0.5.0...${{ github.ref_name }}).
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
          fail_on_unmatched_files: false
