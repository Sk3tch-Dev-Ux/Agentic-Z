[package]
name = "agentic-z"
version = "0.1.0"
description = "Agentic-Z desktop — DayZ modding command center"
authors = ["DayZ n' Chill"]
edition = "2021"

[lib]
name = "agentic_z_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev profile for fast iteration
[profile.dev]
incremental = true

# Release profile: optimize for size + speed
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
